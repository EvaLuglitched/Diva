      <circle cx="262" cy="500" r="168" fill="url(#skinDark)"/>
      <circle cx="762" cy="500" r="168" fill="url(#skinDark)"/>
      <circle cx="268" cy="508" r="122" fill="url(#earInner)"/>
      <circle cx="756" cy="508" r="122" fill="url(#earInner)"/>
