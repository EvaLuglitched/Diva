<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- macOS 图标形状：大圆角方（Big Sur 起的 squircle 近似） -->
    <clipPath id="squircle">
      <path d="M512 24 C 820 24 1000 204 1000 512 C 1000 820 820 1000 512 1000 C 204 1000 24 820 24 512 C 24 204 204 24 512 24 Z"/>
    </clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8fd0"/>
      <stop offset="0.55" stop-color="#ff4fa3"/>
      <stop offset="1" stop-color="#b8228a"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="armor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd6ef"/>
      <stop offset="1" stop-color="#ff9bd6"/>
    </linearGradient>
    <linearGradient id="armorDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7fc6"/>
      <stop offset="1" stop-color="#e2409a"/>
    </linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b2a44"/>
      <stop offset="0.5" stop-color="#2f4f7a"/>
      <stop offset="1" stop-color="#1b2a44"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4dfff0"/>
      <stop offset="1" stop-color="#8cffe6"/>
    </linearGradient>
    <radialGradient id="bubble" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="0.9" stop-color="#8cffe6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.9"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#5a0a40" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- 底：糖果粉渐变 + 光扫 + 远处的霓虹拱门光晕 -->
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <circle cx="512" cy="1180" r="620" fill="#ffffff" fill-opacity="0.10"/>
    <circle cx="512" cy="1140" r="520" fill="none" stroke="#8cffe6" stroke-opacity="0.55" stroke-width="22"/>
    <circle cx="512" cy="1140" r="470" fill="none" stroke="#ffe066" stroke-opacity="0.45" stroke-width="16"/>
    <rect width="1024" height="1024" fill="url(#sheen)"/>

    <!-- 飘着的泡泡（泡泡炮） -->
    <g>
      <circle cx="150" cy="210" r="58" fill="url(#bubble)"/>
      <circle cx="238" cy="118" r="30" fill="url(#bubble)"/>
      <circle cx="880" cy="170" r="46" fill="url(#bubble)"/>
      <circle cx="930" cy="300" r="26" fill="url(#bubble)"/>
      <circle cx="120" cy="560" r="24" fill="url(#bubble)"/>
    </g>

    <!-- 机甲大象的头（正面）：两只大耳 = 装甲板，粉色头盔，青色发光面罩，鼻子往下卷，鼻尖一滴水 -->
    <g filter="url(#shadow)">
      <!-- 耳朵 -->
      <path d="M268 420 C 150 400 92 500 118 620 C 140 720 240 760 320 720 L 320 470 Z" fill="url(#armorDark)"/>
      <path d="M756 420 C 874 400 932 500 906 620 C 884 720 784 760 704 720 L 704 470 Z" fill="url(#armorDark)"/>
      <path d="M286 450 C 200 440 160 520 178 610 C 192 690 262 720 318 695 L 318 480 Z" fill="#ffb3e0" fill-opacity="0.55"/>
      <path d="M738 450 C 824 440 864 520 846 610 C 832 690 762 720 706 695 L 706 480 Z" fill="#ffb3e0" fill-opacity="0.55"/>
      <!-- 头盔 -->
      <path d="M512 300 C 650 300 730 390 730 520 C 730 640 650 720 512 720 C 374 720 294 640 294 520 C 294 390 374 300 512 300 Z" fill="url(#armor)"/>
      <!-- 头顶的 D.Va 式兔耳小天线 -->
      <path d="M430 318 C 400 250 390 200 410 160 C 440 200 452 260 452 300 Z" fill="url(#armorDark)"/>
      <path d="M594 318 C 624 250 634 200 614 160 C 584 200 572 260 572 300 Z" fill="url(#armorDark)"/>
      <!-- 头盔分缝线 -->
      <path d="M330 470 Q 512 410 694 470" fill="none" stroke="#e2409a" stroke-opacity="0.55" stroke-width="10" stroke-linecap="round"/>
      <!-- 面罩（发光青色带） -->
      <path d="M338 512 C 400 470 624 470 686 512 C 690 580 652 612 512 612 C 372 612 334 580 338 512 Z" fill="url(#visor)"/>
      <path d="M352 522 C 410 490 614 490 672 522 C 672 566 648 590 512 590 C 376 590 352 566 352 522 Z" fill="url(#glow)" fill-opacity="0.18"/>
      <!-- 两只眼睛：青色发光 -->
      <ellipse cx="438" cy="540" rx="46" ry="30" fill="url(#glow)"/>
      <ellipse cx="586" cy="540" rx="46" ry="30" fill="url(#glow)"/>
      <ellipse cx="438" cy="540" rx="46" ry="30" fill="#4dfff0" fill-opacity="0.5" filter="url(#soft)"/>
      <ellipse cx="586" cy="540" rx="46" ry="30" fill="#4dfff0" fill-opacity="0.5" filter="url(#soft)"/>
      <ellipse cx="424" cy="530" rx="14" ry="8" fill="#ffffff" fill-opacity="0.85"/>
      <ellipse cx="572" cy="530" rx="14" ry="8" fill="#ffffff" fill-opacity="0.85"/>
      <!-- 象鼻：从面罩下方往下、往右卷 -->
      <path d="M470 640 C 470 720 480 800 520 850 C 560 900 640 900 668 850 C 690 812 660 770 620 790 C 596 802 600 836 626 836" fill="none" stroke="url(#armor)" stroke-width="96" stroke-linecap="round"/>
      <path d="M470 640 C 470 720 480 800 520 850 C 560 900 640 900 668 850 C 690 812 660 770 620 790 C 596 802 600 836 626 836" fill="none" stroke="#e2409a" stroke-opacity="0.35" stroke-width="8" stroke-dasharray="2 38" stroke-linecap="round"/>
      <!-- 鼻尖的一滴水 / 泡泡 -->
      <circle cx="652" cy="846" r="40" fill="url(#bubble)"/>
      <circle cx="652" cy="846" r="40" fill="#8cffe6" fill-opacity="0.35"/>
    </g>

    <!-- 底部的小标 DIVA（细细一行，可选） -->
    <text x="512" y="958" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="74" letter-spacing="14" fill="#ffffff" fill-opacity="0.92" font-style="italic">DIVA</text>
  </g>
</svg>
