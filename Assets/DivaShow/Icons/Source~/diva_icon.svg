91.8 L 589.4 691.5 L 588.1 691.0 L 586.7 690.6 L 585.3 690.0 L 583.8 689.4 L 582.2 688.7 L 581.0 688.1 L 579.9 687.5 L 578.8 686.8 L 577.7 686.0 L 576.7 685.3 L 575.7 684.5 L 574.8 683.6 L 573.9 682.7 L 573.0 681.8 L 572.1 680.8 L 571.3 679.7 L 570.4 678.6 L 569.6 677.4 L 568.8 676.2 L 568.0 674.9 L 567.2 673.6 L 566.4 672.2 L 565.7 670.7 L 564.9 669.1 L 564.2 667.5 L 563.5 665.8 L 562.9 664.0 L 562.2 662.1 L 561.6 660.2 L 561.0 658.2 L 560.5 656.1 L 560.0 654.0 L 559.5 651.8 L 559.0 649.5 L 558.6 647.2 L 558.3 644.8 L 558.0 642.3 L 557.7 639.8 L 557.5 637.2 L 557.3 634.5 L 557.2 631.8 L 557.1 629.1 L 557.1 626.3 L 557.1 623.4 L 557.2 620.5 L 557.4 617.5 L 557.6 614.5 L 557.9 611.5 L 558.2 608.4 L 558.7 605.3 L 559.2 602.2 L 559.9 598.6 Z" fill="url(#skin)"/>
      <g fill="none" stroke="#6e34b8" stroke-opacity="0.3" stroke-width="7" stroke-linecap="round">
        <path d="M 494.0 681.0 Q 523.8 677.3 548.7 660.5"/><path d="M 539.2 736.6 Q 559.7 718.7 568.5 693.0"/><path d="M 603.2 750.1 Q 607.6 725.9 598.1 703.2"/>
      </g>
      <!-- 鼻尖吹出来的小泡泡 -->
      <circle cx="680" cy="624" r="26" fill="url(#bubble)"/>
      <circle cx="680" cy="624" r="26" fill="#ffd58a" fill-opacity="0.3"/>
      <circle cx="714" cy="582" r="14" fill="url(#bubble)"/>
    </g>

    <!-- 底部的小标 DIVA -->
    <text x="512" y="958" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="900" font-size="74" letter-spacing="14" fill="#ffffff" fill-opacity="0.92" font-style="italic">DIVA</text>
  </g>
</svg>
